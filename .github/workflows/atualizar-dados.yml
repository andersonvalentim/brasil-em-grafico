name: Atualizar dados

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Coletar dados oficiais
        run: npm run dados
      - name: Validar catálogo
        run: npm run validar
      - name: Commit se houver mudança
        run: |
          if git diff --quiet -- dados; then
            echo "Nenhuma mudança em dados/"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados
          git commit -m "chore: atualiza dados oficiais"
          git push
