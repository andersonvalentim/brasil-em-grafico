name: Diagnóstico IBGE (temporário)

on:
  workflow_dispatch:

permissions: {}

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Testar acesso às APIs do IBGE
        run: |
          for host in servicodados.ibge.gov.br apisidra.ibge.gov.br sidra.ibge.gov.br; do
            echo "== $host"
            getent ahosts "$host" | head -4 || true
            curl -sS -4 -m 25 -o /dev/null -w "IPv4 HTTP %{http_code} em %{time_total}s\n" "https://$host/" || true
          done
          echo "== consulta real"
          curl -sS -4 -m 40 -g "https://servicodados.ibge.gov.br/api/v3/agregados/7060/periodos/-1/variaveis/2265?localidades=N1[all]&classificacao=315[7169]" | head -c 300 || true
          echo
          curl -sS -4 -m 40 "https://apisidra.ibge.gov.br/values/t/7060/n1/all/v/2265/p/last%201/c315/7169" | head -c 300 || true
          echo
          curl -sS -m 10 https://ipinfo.io/json || true
